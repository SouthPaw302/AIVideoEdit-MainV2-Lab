name: MainV2 ONNX Checkpoint

on:
  push:
    branches:
      - MainV2
    paths:
      - "general/reusable/intelligence/MODEL_REGISTRY.json"
      - "general/reusable/tools/model_registry.py"
      - "general/reusable/tools/model_provision.py"
      - "general/reusable/tools/music_beat_worker.py"
      - "tests/test_music_beat_worker.py"
      - ".github/workflows/mainv2-onnx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onnx-cpu-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ONNX checkpoint dependencies
        run: python -m pip install numpy onnxruntime
      - name: Provision pinned Beat This ONNX model
        run: python -m general.reusable.tools.model_provision music-beat-onnx-v1
      - name: Run real CPU ONNX fixture
        shell: bash
        run: |
          python - <<'PY'
          import json, math, struct, wave
          from pathlib import Path
          from general.reusable.tools.music_beat_worker import analyze_music

          path=Path("beat_fixture_120.wav")
          sr=22050; duration=12.0; total=int(duration*sr)
          samples=[0.0]*total
          beat_interval=int(sr*0.5); eighth=int(beat_interval/2)
          for start in range(0,total,eighth):
              strong=(start % beat_interval)==0
              freq=85 if strong else 220
              amp=0.9 if strong else 0.35
              pulse=int(sr*(0.055 if strong else 0.025))
              for i in range(pulse):
                  idx=start+i
                  if idx>=total: break
                  env=(1.0-i/pulse)**2
                  samples[idx]+=amp*env*math.sin(2*math.pi*freq*i/sr)
          with wave.open(str(path),"wb") as wf:
              wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(sr)
              wf.writeframes(b"".join(struct.pack("<h",max(-32767,min(32767,int(x*32767)))) for x in samples))

          evidence=analyze_music(path)
          print(json.dumps(evidence,indent=2,sort_keys=True))
          assert evidence["engine"]=="beat_this_onnx"
          assert evidence["providers"][0]=="CPUExecutionProvider"
          assert len(evidence["beat_positions_seconds"])>=4
          assert evidence["authority"]=="evidence_only"
          PY
