name: DeepSeek Harness Optional Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIVE_HARNESS_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run provider-neutral MCP smoke test
        run: python prototype/backend_gui/harness_selftest.py
      - name: Verify normal Tool API imports with Harness optional
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "prototype/backend_gui")
          import tool_api
          names={x["name"] for x in tool_api.schemas()}
          assert "production.status" in names
          print("PASS normal Tool API remains available")
          PY
