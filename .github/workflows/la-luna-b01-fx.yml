name: La Luna B01 — Real Per-Still FX Render (Director First)

on:
  push:
    branches:
      - song/la-luna-de-florida
    paths:
      - .github/workflows/la-luna-b01-fx.yml
      - scripts/la_luna_b01_fx_runner.py
      - projects/la-luna-de-florida/B01_DIRECTOR_PREFLIGHT.json
      - projects/la-luna-de-florida/media/b01_sources/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: la-luna-b01-fx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  b01-individual-fx:
    name: "Render B01 FX ${{ matrix.group }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: "S01-S02"
            shot_a: "B01-S01"
            shot_b: "B01-S02"
          - group: "S03-S04"
            shot_a: "B01-S03"
            shot_b: "B01-S04"
          - group: "S05-S06"
            shot_a: "B01-S05"
            shot_b: "B01-S06"
          - group: "S07-S08"
            shot_a: "B01-S07"
            shot_b: "B01-S08"
          - group: "S09-S10"
            shot_a: "B01-S09"
            shot_b: "B01-S10"
    steps:
      - name: Checkout immutable production branch including real B01 source bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Canonical current-main OS boot and Director/guards
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python bootstrap.py boot --repo-root "$PWD" --branch song/la-luna-de-florida --offline
          python .aivideoedit/os/general/reusable/tools/production_guard.py --branch song/la-luna-de-florida
          python .aivideoedit/os/general/reusable/tools/narrative_guard.py --branch song/la-luna-de-florida
          if test -f .aivideoedit/os/general/reusable/tools/recut_guard.py; then
            python .aivideoedit/os/general/reusable/tools/recut_guard.py --branch song/la-luna-de-florida
          fi
          if test -f .aivideoedit/os/general/reusable/tools/workflow_guard.py; then
            python .aivideoedit/os/general/reusable/tools/workflow_guard.py --branch song/la-luna-de-florida
          fi
      - name: Install approved FXRuntime and video backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy==2.2.6" "opencv-python-headless==4.11.0.86"
          ffmpeg -version | head -n 1
      - name: Verify Director preflight against live bootstrapped main registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, hashlib
          d=json.loads(pathlib.Path("projects/la-luna-de-florida/B01_DIRECTOR_PREFLIGHT.json").read_text())
          assert d["phase"]=="BEFORE_FX_MEDIA_GENERATION"
          assert d["director_disposition"]=="PROOF_AUTHORIZED_REVIEW_PENDING"
          assert d["render_contract"]["source_preserve_unmodified"] is True
          assert d["render_contract"]["human_visual_approval"] is False
          assert len(d["shots"])==10
          reg=json.loads(pathlib.Path(".aivideoedit/os/general/reusable/fx_v2/registry.json").read_text())
          for entry in d["shots"]:
              p=pathlib.Path("projects/la-luna-de-florida/media/b01_sources")/(entry["shot_id"]+".jpg")
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==entry["source_sha256"], p
              assert all(reg["effects"][k]["gate_status"]=="approved" for k in entry["approved_runtime_effect_candidates"])
          print("PRE-FX SOURCE SHA / CURRENT-MAIN REGISTRY / DIRECTOR: VERIFIED")
          PY
      - name: Actually render 4 independent H.264 loops and 4 derived stills
        shell: bash
        env:
          SHOT_A: ${{ matrix.shot_a }}
          SHOT_B: ${{ matrix.shot_b }}
        run: |
          set -euo pipefail
          python scripts/la_luna_b01_fx_runner.py \
            --shots "$SHOT_A" "$SHOT_B" --out "$RUNNER_TEMP/real-b01-fx"
          python - <<'PY'
          import json, os, pathlib
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"real-b01-fx/B01_FX_RUNNER_RECEIPT.json"
          data=json.loads(path.read_text())
          assert data["variant_count"]==4
          assert data["shot_count"]==2
          assert all(x["decoded_without_error"] and x["max_mean_absolute_pixel_change"]>=.03 for x in data["generated"])
          print("4 REAL OUTPUTS WITH SOURCES AND QC:",path)
          PY
      - name: Record exact output in GitHub Actions summary
        if: always()
        shell: bash
        run: |
          {
            echo '### La Luna de Florida — Batch 01 real FX proof'
            echo 'Group: ${{ matrix.group }}'
            echo 'Input: immutable, hash-pinned, original B01 JPEGs from song branch.'
            echo 'Output: 2 FX alternate stills and 2 loop MP4s per input; no camera effect.'
            echo 'Uses current-main FXRuntime and FFmpeg. No creative/human PASS.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload original duplicates, A/B loops, FX stills and measured receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: la-luna-b01-real-fx-${{ matrix.group }}-${{ github.run_id }}
          path: ${{ runner.temp }}/real-b01-fx/
          retention-days: 30
          if-no-files-found: warn
