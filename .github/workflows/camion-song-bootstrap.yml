name: El Camión — isolated song production bootstrap

on:
  push:
    branches: [song/el-camion-y-la-carretera]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete MainV2 Lab production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify isolation, project identity and source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SouthPaw302/AIVideoEdit-MainV2-Lab"
          test "$GITHUB_REF_NAME" = "song/el-camion-y-la-carretera"
          git diff --exit-code origin/MainV2 -- bootstrap.py general/reusable prototype/backend_gui
          python scripts/validate_contract.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("projects/el-camion-y-la-carretera")
          s=json.loads((p/"PROJECT_STATE.json").read_text())
          m=json.loads((p/"MEDIA_PLAN.json").read_text())
          src=json.loads((p/"SOURCE_AUTHORITY.json").read_text())
          assert s["stage"]=="INITIALIZED", "No phantom stage advancement"
          assert s["branch"]=="song/el-camion-y-la-carretera"
          assert len(json.loads((p/"STORYBOARD_DRAFT.json").read_text())["entries"])==30
          assert all(len(x["shot_ids"])==10 for x in json.loads((p/"MEDIA_BATCHES.json").read_text())["batches"])
          assert m["visual_direction_gate"]["locked"] and m["visual_direction_gate"]["user_selection"]["selected_option_numbers"]==[2]
          assert src["audio"]["status"]=="SOURCE_IDENTIFIED_LOCAL_SHA_VERIFIED" and src["lyrics"]["complete"] is True
          print("SONG PREFLIGHT: 23 production manifests, 30-shot budget, 3 ten-shot batches")
          print("SOURCES IDENTIFIED: original WAV hash and 40 lyric lines; end-to-end film NOT complete")
          PY
      - name: Boot complete MainV2 Lab OS on active song branch
        env:
          AIVIDEOEDIT_VALIDATION_MODE: '1'
          AIVIDEOEDIT_AUTHORITY_REF: MainV2
        run: |
          python bootstrap.py boot --repo-root "$GITHUB_WORKSPACE" --branch "song/el-camion-y-la-carretera" --project "projects/el-camion-y-la-carretera" --offline
      - name: Check boot generated session and current OS authority
        shell: bash
        run: |
          test -s .aivideoedit/SECOND_BRAIN.md
          test -s .aivideoedit/session.json
          test -s .aivideoedit/os/PRIME_DIRECTIVE.md
          test -s .aivideoedit/os/SOUL.md
          python .aivideoedit/os/general/reusable/tools/production_guard.py --branch song/el-camion-y-la-carretera
          python .aivideoedit/os/general/reusable/tools/narrative_guard.py --branch song/el-camion-y-la-carretera
          python .aivideoedit/os/general/reusable/tools/recut_guard.py --branch song/el-camion-y-la-carretera
          python .aivideoedit/os/general/reusable/tools/workflow_guard.py --branch song/el-camion-y-la-carretera
      - name: Emit accurate status — boot is not media readiness
        if: always()
        run: |
          echo '### El Camión y la Carretera — MainV2 Lab' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production bootstrap is a separate gate from source ingest and visual QC.' >> "$GITHUB_STEP_SUMMARY"
          echo '**Original WAV and 40 lyric lines:** identified. **Batch 01:** ten stills and derived FX loops; two Gemini true-motion continuations.' >> "$GITHUB_STEP_SUMMARY"
          echo '**Workprint:** 36 seconds, visual acceptance PENDING; this is not a finished film.' >> "$GITHUB_STEP_SUMMARY"
