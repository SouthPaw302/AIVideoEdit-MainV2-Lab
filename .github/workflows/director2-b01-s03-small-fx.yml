name: "Director2 — B01-S03 Real Per-Still FX Proof"
on:
  push:
    branches:
      - song/el-viento-trae-tu-nombre
    paths:
      - .github/workflows/director2-b01-s03-small-fx.yml
      - projects/el-viento-trae-tu-nombre/director2/runner_probe/**
permissions:
  contents: read
jobs:
  one-shot-fx:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout active song production branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: song/el-viento-trae-tu-nombre
          persist-credentials: false
          path: work
      - name: Checkout locked current main OS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 900e3e5749ed6fa13ad91524975a9e64661e6649
          persist-credentials: false
          path: engine
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Boot production OS and validate pinned engine
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = 900e3e5749ed6fa13ad91524975a9e64661e6649
          (cd work && python bootstrap.py boot --repo-root . --branch song/el-viento-trae-tu-nombre | tee ../director2-boot.log)
          grep -F 'AIVideoEdit OS BOOTSTRAP: PASS' director2-boot.log
      - name: Install real FX runtime requirements
        run: |
          python -m pip install --quiet "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5" pillow
          ffmpeg -version | head -1
      - name: Render *only* B01-S03 small FX proof with canonical executor
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
        run: |
          set -euo pipefail
          python work/projects/el-viento-trae-tu-nombre/director2/runner_probe/render_fx.py --image work/projects/el-viento-trae-tu-nombre/director2/runner_probe/B01-S03_runner_source_quality76.jpg --controls work/projects/el-viento-trae-tu-nombre/director2/runner_probe/B01-S03_music_controls.json --out out
          test -s out/B01-S03_canonicalFX2_2s.mp4
          test -s out/B01-S03_2s_loop.gif
          test -s out/FX2_EXECUTION_LEDGER.jsonl
      - name: Upload isolated shot FX evidence (not a film)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: director2-b01-s03-real-small-fx-${{ github.run_id }}
          path: |
            out/
            director2-boot.log
          if-no-files-found: warn
          retention-days: 14
