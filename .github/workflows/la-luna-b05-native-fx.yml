name: La Luna B05 — Native Lab Main FX Source-Proof
on:
  push:
    branches:
      - song/la-luna-de-florida
    paths:
      - .github/workflows/la-luna-b05-native-fx.yml
      - scripts/la_luna_b05_native_fx_runner.py
      - projects/la-luna-de-florida/B05_DIRECTOR_PREFLIGHT.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: la-luna-b05-native-fx-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-fx-b05:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Boot exact latest Lab-main OS and preserve song-branch authority
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python bootstrap.py boot --repo-root "$PWD" --branch song/la-luna-de-florida --offline
          python scripts/la_luna_fx_canon_guard.py
          python .aivideoedit/os/general/reusable/tools/production_guard.py --branch song/la-luna-de-florida
          python .aivideoedit/os/general/reusable/tools/narrative_guard.py --branch song/la-luna-de-florida
      - name: Pinned media effects and Drive source retrieval dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'opencv-python-headless==4.11.0.86' 'gdown==5.2.0'
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg unzip
      - name: Download unchanged B05 nine-still ZIP from linked Drive archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b05_sources"
          gdown --id 1D6kgeamq_cnfpvGcVzbPO-U7GwLqtjV2 --output "$RUNNER_TEMP/b05_archive.zip" --quiet
          printf '%s  %s\n' 'b80050b8808255fe023296ba9e722c60116fd6fe6e24fba2b619e98cc62ad4d4' "$RUNNER_TEMP/b05_archive.zip" | sha256sum --check --status
          unzip -t "$RUNNER_TEMP/b05_archive.zip"
          unzip -q "$RUNNER_TEMP/b05_archive.zip" -d "$RUNNER_TEMP/b05_sources"
          for n in $(seq -w 1 10); do cp "$RUNNER_TEMP/b05_sources/B05_NIGHT_EXTRA-S$n.png" "$RUNNER_TEMP/b05_sources/B05-S$n.png"; done
          test "$(find "$RUNNER_TEMP/b05_sources" -maxdepth 1 -name 'B05-S*.png' | wc -l)" -eq 10
          test -f "$RUNNER_TEMP/b05_sources/B05-S10.png"
      - name: Run real bootstrapped FXRuntime for ten source-proven B05 shots
        shell: bash
        run: |
          set -euo pipefail
          python scripts/la_luna_b05_native_fx_runner.py \
            --source-dir "$RUNNER_TEMP/b05_sources" \
            --out "$RUNNER_TEMP/b05_fx_proofs" \
            --shots B05-S01 B05-S02 B05-S03 B05-S04 B05-S05 B05-S06 B05-S07 B05-S08 B05-S09 B05-S10
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ['RUNNER_TEMP'])/'b05_fx_proofs/B05_NATIVE_FX_PROOF_RECEIPT.json'
          j=json.loads(f.read_text())
          assert len(j['generated'])==20 and all(x['decoded'] for x in j['generated'])
          assert j['all_ten_originals_sha_verified'] is True
          assert j['director_approval'] is False
          print('B05_NIGHT_EXTRA_20_LIGHT_FX_PROOFS_PASS; DAWN_STILLS_NOT_CERTIFIED; CHARACTER_FX_NOT_CERTIFIED')
          PY
      - name: Report strict light FX scope
        if: always()
        run: |
          {
            echo '### B05 native FX'
            echo 'Ten NIGHT EXTRA originals are hash-verified; this does not grant dawn finale footage approval.'
            echo 'This run validates B05 night-extras light FX only, not canonical sunrise, character performance, master film or release.'
            echo 'If gdown cannot access the authenticated Drive archive, fail closed: DO NOT fall back to synthetic media.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: la-luna-b05-native-fx-${{ github.run_id }}
          path: ${{ runner.temp }}/b05_fx_proofs/
          retention-days: 30
          if-no-files-found: warn
