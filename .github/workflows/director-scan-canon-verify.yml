name: Director Scan Canon — regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  director-scan-canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify fail-closed director-scan evidence behavior
        run: python -m unittest discover -s general/reusable/tools -p test_director_scan_gate.py -v
      - name: Validate machine-readable scan record schema JSON
        run: python -m json.tool general/reusable/DIRECTOR_SCAN_RECORD.schema.json > /dev/null
