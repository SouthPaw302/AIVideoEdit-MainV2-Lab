name: La Luna B01 B02 — Director Moving Scene Compile
on:
  push:
    branches: [song/la-luna-de-florida]
    paths:
      - .github/workflows/la-luna-b01b02-moving-scenes.yml
      - scripts/la_luna_b01b02_movement_compile.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  moving-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {batch: B01, run: 38675807521, artifact: la-luna-b01-real-fx-S01-S02-38675807521, a: B01-S01, b: B01-S02}
          - {batch: B01, run: 38675807521, artifact: la-luna-b01-real-fx-S03-S04-38675807521, a: B01-S03, b: B01-S04}
          - {batch: B01, run: 38675807521, artifact: la-luna-b01-real-fx-S05-S06-38675807521, a: B01-S05, b: B01-S06}
          - {batch: B01, run: 38675807521, artifact: la-luna-b01-real-fx-S07-S08-38675807521, a: B01-S07, b: B01-S08}
          - {batch: B01, run: 38675807521, artifact: la-luna-b01-real-fx-S09-S10-38675807521, a: B01-S09, b: B01-S10}
          - {batch: B02, run: 38673490212, artifact: la-luna-b02-real-fx-S01-S02-38673490212, a: B02-S01, b: B02-S02}
          - {batch: B02, run: 38673490212, artifact: la-luna-b02-real-fx-S03-S04-38673490212, a: B02-S03, b: B02-S04}
          - {batch: B02, run: 38673490212, artifact: la-luna-b02-real-fx-S05-S06-38673490212, a: B02-S05, b: B02-S06}
          - {batch: B02, run: 38673490212, artifact: la-luna-b02-real-fx-S07-S08-38673490212, a: B02-S07, b: B02-S08}
          - {batch: B02, run: 38673490212, artifact: la-luna-b02-real-fx-S09-S10-38673490212, a: B02-S09, b: B02-S10}
    name: "Motion ${{ matrix.batch }} ${{ matrix.a }} + ${{ matrix.b }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Boot exact current-main OS; validate source isolation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python bootstrap.py boot --repo-root "$PWD" --branch song/la-luna-de-florida --offline
          python scripts/la_luna_fx_canon_guard.py
      - name: Install pinned render stack
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'opencv-python-headless==4.11.0.86'
          command -v gh && command -v ffmpeg && command -v ffprobe
      - name: Retrieve original A/B light FX from successful immutable Actions run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inputs/${{ matrix.batch }}"
          gh run download "${{ matrix.run }}" -n "${{ matrix.artifact }}" -D "$RUNNER_TEMP/inputs/${{ matrix.batch }}"
      - name: Render source-derived 96-frame moving-scene clips and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/la_luna_b01b02_movement_compile.py --input-dir "$RUNNER_TEMP/inputs" --out "$RUNNER_TEMP/moving-scenes" --shots "${{ matrix.a }}" "${{ matrix.b }}"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"moving-scenes/MOVEMENT_PROOF_RECEIPT.json").read_text())
          assert d["count"]==2
          assert all(x["frames"]==96 and x["full_video_decode"] for x in d["generated"])
          assert d["human_release_approval"] is False
          print("MOVING_SCENE_TECHNICAL_PASS; CHARACTER_SEMANTIC_APPROVAL_NOT_CLAIMED")
          PY
      - name: Director evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### La Luna moving-scene proof"
            echo "Source stills and previous light-FX outputs unchanged."
            echo "Per-shot 4s at 24fps. Moving-camera/cloth/material compositing is not automatically dancing or instrument-playing."
            echo "No user film/artistic acceptance claimed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload moving-scene proofs and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: la-luna-motion-${{ matrix.batch }}-${{ matrix.a }}-${{ github.run_id }}
          path: ${{ runner.temp }}/moving-scenes/
          retention-days: 30
          if-no-files-found: warn
