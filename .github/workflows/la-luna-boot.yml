name: La Luna de Florida — canonical bootstrap validation

on:
  push:
    branches:
      - song/la-luna-de-florida
    paths:
      - .github/workflows/la-luna-boot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-current-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Boot exact current main OS and validate song branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python bootstrap.py boot --repo-root "$PWD" --branch song/la-luna-de-florida --offline
          python - <<'PY'
          import json
          with open(".aivideoedit/session.json") as f: session=json.load(f)
          assert session["branch"]=="song/la-luna-de-florida"
          assert session["guard_result"]=="PASS"
          print("LA LUNA REPO OS BOOT VALIDATED:",session["branch"])
          print("Current-main OS SHA:",session.get("os_main_commit"))
          PY
      - name: Show current project stage (not artistic approval)
        run: |
          python - <<'PY'
          import json
          p=json.load(open("projects/la-luna-de-florida/PROJECT_STATE.json"))
          print("Canonical project stage:",p["stage"])
          assert p["stage"]=="INITIALIZED"
          assert p["human_visual_approval"] is False
          assert p["production_complete"] is False
          PY
