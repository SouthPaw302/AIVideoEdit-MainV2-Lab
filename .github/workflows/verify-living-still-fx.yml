name: verify-living-still-fx

on:
  pull_request:
    paths:
      - 'general/reusable/fx_v2/living_still_fx.py'
      - 'general/reusable/fx_v2/verify_living_still_fx.py'
      - 'general/reusable/fx_v2/registry.json'
      - '.github/workflows/verify-living-still-fx.yml'
  push:
    branches: [main]
    paths:
      - 'general/reusable/fx_v2/living_still_fx.py'
      - 'general/reusable/fx_v2/verify_living_still_fx.py'
      - 'general/reusable/fx_v2/registry.json'
      - '.github/workflows/verify-living-still-fx.yml'

permissions:
  contents: read

jobs:
  living-still-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Compile living-still FX
        run: python -m py_compile general/reusable/fx_v2/living_still_fx.py general/reusable/fx_v2/verify_living_still_fx.py
      - name: Verify registry, pixel motion, loop closure, and transition endpoints
        run: python general/reusable/fx_v2/verify_living_still_fx.py
