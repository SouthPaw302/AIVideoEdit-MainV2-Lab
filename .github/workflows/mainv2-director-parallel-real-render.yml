name: AIVideoEdit — Canonical Production Candidate (Director + Parallel)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Authorized song/<slug> or project/<slug> branch; main is forbidden"
        type: string
        required: true
      project:
        description: "Branch project directory"
        type: string
        required: true
      manifest:
        description: "Branch-relative real render manifest"
        type: string
        required: true
      max_shots_per_shard:
        description: "Maximum contiguous shots per parallel runner"
        type: number
        required: true
        default: 8

permissions:
  contents: read

concurrency:
  group: canonical-candidate-${{ inputs.source_ref }}-${{ inputs.project }}-${{ inputs.manifest }}
  cancel-in-progress: false

env:
  SOURCE_REF: ${{ inputs.source_ref }}
  PROJECT: ${{ inputs.project }}
  MANIFEST: ${{ inputs.manifest }}
  GH_TOKEN: ${{ github.token }}
  FFMPEG_APT_VERSION: "7:6.1.1-3ubuntu5"

jobs:
  director-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      engine_sha: ${{ steps.lock-lineage.outputs.engine_sha }}
      source_sha: ${{ steps.lock-lineage.outputs.source_sha }}
      matrix: ${{ steps.plan-shards.outputs.matrix }}
    steps:
      - name: Check out immutable MainV2 engine from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: engine
          fetch-depth: 0
          persist-credentials: false

      - name: Check out authorized production branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_REF }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/.github/requirements/render-runner.lock.txt

      - name: Install render and harness dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REF" != "main"
          case "$SOURCE_REF" in song/*|project/*) ;; *) echo "production must run from song/* or project/* branch"; exit 1 ;; esac
          sudo apt-get update -y
          sudo apt-get install -y --allow-downgrades "ffmpeg=$FFMPEG_APT_VERSION"
          python -m pip install --disable-pip-version-check -r engine/.github/requirements/render-runner.lock.txt

      - name: Verify and boot exact canonical MainV2 main engine
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SouthPaw302/AIVideoEdit-MainV2-Lab"
          python scripts/validate_contract.py
          python bootstrap.py boot --repo-root "$PWD" --branch main --offline
          python - <<'PY'
          import json
          p=json.load(open('.aivideoedit/session.json'))
          assert p['branch']=='main'
          print('CANONICAL MAIN ENGINE BOOT: PASS')
          print('MAIN COMMIT:', p.get('os_main_commit'))
          PY

      - name: Lock engine, project, manifest, toolchain and original media bytes once
        id: lock-lineage
        shell: bash
        env:
          AIVE_MEDIA_TOKEN: ${{ secrets.AIVE_MEDIA_TOKEN }}
          AIVE_MEDIA_AUTH_HOSTS: ${{ vars.AIVE_MEDIA_AUTH_HOSTS }}
        run: |
          set -euo pipefail
          engine_sha="$(git -C engine rev-parse HEAD)"
          source_sha="$(git -C source rev-parse HEAD)"
          echo "engine_sha=$engine_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          python engine/scripts/render_lineage.py stage \
            --manifest "source/$MANIFEST" \
            --input-root source \
            --engine-root engine \
            --project "source/$PROJECT" \
            --out "$RUNNER_TEMP/media-bundle"
          python engine/scripts/render_lineage.py verify \
            --lineage "$RUNNER_TEMP/media-bundle/RUN_LINEAGE.json" \
            --manifest "$RUNNER_TEMP/media-bundle/STAGED_MANIFEST.json" \
            --media-root "$RUNNER_TEMP/media-bundle" \
            --source-root source --engine-root engine --project "source/$PROJECT" \
            --original-manifest "source/$MANIFEST"

      - name: Plan complete arbitrary-size fan-out from the locked manifest
        id: plan-shards
        shell: bash
        run: |
          set -euo pipefail
          python engine/scripts/plan_render_shards.py \
            --manifest "$RUNNER_TEMP/media-bundle/STAGED_MANIFEST.json" \
            --max-shots "${{ inputs.max_shots_per_shard }}" \
            --out "$RUNNER_TEMP/director-gate/SHARD_PLAN.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run live Director input, Harness bridge, JEV, FX resolution and pinned ONNX gate
        shell: bash
        run: |
          set -euo pipefail
          python engine/scripts/director_harness_gate.py \
            --source-root "$PWD/source" \
            --engine-root "$PWD/engine" \
            --project "$PWD/source/$PROJECT" \
            --manifest "$PWD/source/$MANIFEST" \
            --lineage "$RUNNER_TEMP/media-bundle/RUN_LINEAGE.json" \
            --media-root "$RUNNER_TEMP/media-bundle" \
            --shard-plan "$RUNNER_TEMP/director-gate/SHARD_PLAN.json" \
            --out "$RUNNER_TEMP/director-gate"

      - name: Retain director and canonical gate receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: director-gate
          path: ${{ runner.temp }}/director-gate/
          retention-days: 30

      - name: Retain one byte-verified media bundle for all fan-out workers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/media-bundle/
          retention-days: 1

  render-shard:
    needs: director-gate
    if: needs.director-gate.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.director-gate.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out immutable MainV2 engine from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.director-gate.outputs.engine_sha }}
          path: engine
          fetch-depth: 0
          persist-credentials: false

      - name: Check out authorized production branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.director-gate.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/.github/requirements/render-runner.lock.txt

      - name: Install shard dependencies and boot canonical main
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REF" != "main"
          sudo apt-get update -y
          sudo apt-get install -y --allow-downgrades "ffmpeg=$FFMPEG_APT_VERSION"
          python -m pip install --disable-pip-version-check -r .github/requirements/render-runner.lock.txt
          python bootstrap.py boot --repo-root "$PWD" --branch main --offline

      - name: Download live Director/Harness gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: director-gate
          path: ${{ runner.temp }}/director-gate

      - name: Download the locked original-media bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: media-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/media-bundle

      - name: Prepare exact timeline shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shard"
          python engine/scripts/prepare_render_shard.py \
            --manifest "$RUNNER_TEMP/media-bundle/STAGED_MANIFEST.json" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --out "$RUNNER_TEMP/shard/manifest.json"

      - name: Render shard with canonical FX and boundary transitions
        shell: bash
        run: |
          set -euo pipefail
          python engine/scripts/render_real_music_film_shard.py \
            --manifest "$RUNNER_TEMP/shard/manifest.json" \
            --staged-manifest "$RUNNER_TEMP/media-bundle/STAGED_MANIFEST.json" \
            --lineage "$RUNNER_TEMP/media-bundle/RUN_LINEAGE.json" \
            --input-root "$RUNNER_TEMP/media-bundle" \
            --source-root "$PWD/source" \
            --project "$PWD/source/$PROJECT" \
            --engine-root "$PWD/engine" \
            --director-gate "$RUNNER_TEMP/director-gate/DIRECTOR_HARNESS_RECEIPT.json" \
            --out "$RUNNER_TEMP/shard/output"

      - name: Upload verified picture shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/
          retention-days: 30

  assemble:
    needs: [director-gate, render-shard]
    if: needs.director-gate.result == 'success' && needs.render-shard.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out immutable MainV2 engine from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.director-gate.outputs.engine_sha }}
          path: engine
          fetch-depth: 0
          persist-credentials: false

      - name: Check out authorized production branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.director-gate.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/.github/requirements/render-runner.lock.txt

      - name: Install assembly dependencies and boot canonical main
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REF" != "main"
          sudo apt-get update -y
          sudo apt-get install -y --allow-downgrades "ffmpeg=$FFMPEG_APT_VERSION"
          python -m pip install --disable-pip-version-check -r .github/requirements/render-runner.lock.txt
          python bootstrap.py boot --repo-root "$PWD" --branch main --offline

      - name: Download Director/Harness gate and all parallel shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: director-gate
          path: ${{ runner.temp }}/director-gate
          merge-multiple: true

      - name: Download all verified picture shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: render-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: false

      - name: Download the same locked original-media bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: media-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/media-bundle

      - name: Assemble and mux original WAV once
        shell: bash
        run: |
          set -euo pipefail
          python engine/scripts/assemble_parallel_music_film.py \
            --manifest "$RUNNER_TEMP/media-bundle/STAGED_MANIFEST.json" \
            --original-manifest "source/$MANIFEST" \
            --lineage "$RUNNER_TEMP/media-bundle/RUN_LINEAGE.json" \
            --input-root "$RUNNER_TEMP/media-bundle" \
            --source-root "$PWD/source" \
            --project "$PWD/source/$PROJECT" \
            --engine-root "$PWD/engine" \
            --gate-dir "$RUNNER_TEMP/director-gate" \
            --shards-dir "$RUNNER_TEMP/shards" \
            --out "$RUNNER_TEMP/final"

      - name: Retain actual MP4 and all receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainv2-parallel-real-film-${{ github.run_id }}
          path: ${{ runner.temp }}/final/
          retention-days: 30

  publish-review-proof:
    needs: [director-gate, assemble]
    if: needs.director-gate.result == 'success' && needs.assemble.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified assembled proof only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mainv2-parallel-real-film-${{ github.run_id }}
          path: ${{ runner.temp }}/final

      - name: Publish durable review-only MP4
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/final"
          gh release create "lab-real-film-${GITHUB_RUN_ID}" \
            "$root/real_music_film.mp4" \
            "$root/render_receipt.json" \
            "$root/contact_sheet.jpg" \
            "$root/PRODUCTION_EXECUTION_LEDGER.json" \
            "$root/VISUAL_QC_EVIDENCE.json" \
            "$root/FX_VISIBILITY_PROOF.zip" \
            "$root/DIRECTOR_HARNESS_RECEIPT.json" \
            "$root/FX_LOCK.json" \
            "$root/RUN_LINEAGE.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.director-gate.outputs.engine_sha }}" \
            --prerelease \
            --title "AIVideoEdit — Director-gated canonical production candidate" \
            --notes "Immutable production branch candidate. Canonical main engine, Director/Harness/JEV/FX/ONNX gate, dynamic parallel shards and fan-in lineage passed. Human normal-speed visual approval is still required."
