name: La Luna — Full Song Beat This ONNX Analysis

on:
  push:
    branches:
      - song/la-luna-de-florida
    paths:
      - .github/workflows/la-luna-full-song-onnx.yml
      - scripts/la_luna_onnx_song_scan.py
      - projects/la-luna-de-florida/analysis_input/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: la-luna-full-song-onnx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze-full-song:
    name: Verify full-song feature input and run pinned ONNX model
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout song and boot exact current-main OS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Boot current main and pass production guards
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python bootstrap.py boot --repo-root "$PWD" --branch song/la-luna-de-florida --offline
          python .aivideoedit/os/general/reusable/tools/production_guard.py --branch song/la-luna-de-florida
      - name: Install pinned ONNX and array runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'onnxruntime==1.22.1'
      - name: Provision source-pinned Beat This ONNX model
        run: python -m general.reusable.tools.model_provision music-beat-onnx-v1
      - name: Real full-song ONNX inference (no fixture, no DSP fallback)
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python scripts/la_luna_onnx_song_scan.py
      - name: GitHub run summary
        if: always()
        run: |
          {
            echo '### La Luna de Florida — Full-Song ONNX Music Analysis'
            echo 'Input: sha256-verified full-song mel features from user-original WAV.'
            echo 'Engine: pinned Beat This! ONNX on CPU; no DSP fallback.'
            echo 'Results and hashes: see uploaded JSON files after successful inference.'
            echo 'Does not alter original WAV, lyrics, 50-shot canon storyboard or FX passes.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified ONNX evidence and summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: la-luna-full-song-beat-this-onnx-${{ github.run_id }}
          path: onnx-song-evidence/
          retention-days: 30
          if-no-files-found: warn
