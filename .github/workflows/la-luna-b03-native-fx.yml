name: La Luna B03 — Native Lab Main FX Source-Proof
on:
  push:
    branches:
      - song/la-luna-de-florida
    paths:
      - .github/workflows/la-luna-b03-native-fx.yml
      - scripts/la_luna_b03_native_fx_runner.py
      - projects/la-luna-de-florida/B03_DIRECTOR_PREFLIGHT.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: la-luna-b03-native-fx-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-fx-b03:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Boot exact latest Lab-main OS and preserve song-branch authority
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python bootstrap.py boot --repo-root "$PWD" --branch song/la-luna-de-florida --offline
          python scripts/la_luna_fx_canon_guard.py
          python .aivideoedit/os/general/reusable/tools/production_guard.py --branch song/la-luna-de-florida
          python .aivideoedit/os/general/reusable/tools/narrative_guard.py --branch song/la-luna-de-florida
      - name: Pinned media effects and Drive source retrieval dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'opencv-python-headless==4.11.0.86' 'gdown==5.2.0'
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg unzip
      - name: Download unchanged B03 nine-still ZIP from linked Drive archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b03_sources"
          gdown --id 1oSb1FLlWJjzPccU2sywjI5gGGw2Lqv4K --output "$RUNNER_TEMP/b03_archive.zip" --quiet
          echo 'da7b54eef5373b2d6b4db69eac0c497e4e9443facbc8fd78db29baecbc565252  ' "$RUNNER_TEMP/b03_archive.zip" | sha256sum --check --status
          unzip -t "$RUNNER_TEMP/b03_archive.zip"
          unzip -q "$RUNNER_TEMP/b03_archive.zip" -d "$RUNNER_TEMP/b03_sources"
          test "$(find "$RUNNER_TEMP/b03_sources" -maxdepth 1 -name 'B03-S*.png' | wc -l)" -eq 9
          test ! -f "$RUNNER_TEMP/b03_sources/B03-S10.png"
      - name: Run real bootstrapped FXRuntime for nine source-proven B03 shots
        shell: bash
        run: |
          set -euo pipefail
          python scripts/la_luna_b03_native_fx_runner.py \
            --source-dir "$RUNNER_TEMP/b03_sources" \
            --out "$RUNNER_TEMP/b03_fx_proofs" \
            --shots B03-S01 B03-S02 B03-S03 B03-S04 B03-S05 B03-S06 B03-S07 B03-S08 B03-S09
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ['RUNNER_TEMP'])/'b03_fx_proofs/B03_NATIVE_FX_PROOF_RECEIPT.json'
          j=json.loads(f.read_text())
          assert len(j['generated'])==18 and all(x['decoded'] for x in j['generated'])
          assert j['S10_original_still_exists'] is False
          assert j['director_approval'] is False
          print('B03_NATIVE_MAIN_18_LIGHT_FX_PROOFS_PASS; CHARACTER_FX_NOT_CERTIFIED; MISSING_S10_UNCHANGED')
          PY
      - name: Report strict light FX scope
        if: always()
        run: |
          {
            echo '### B03 native FX'
            echo 'Nine original source PNGs remain immutable. B03-S10 is MISSING and not a fabricated original.'
            echo 'Native registered light/water FX is per-shot evidence only, not articulated performers, S10 proof, complete film or human release.'
            echo 'If gdown cannot access the authenticated Drive archive, fail closed: DO NOT fall back to synthetic media.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: la-luna-b03-native-fx-${{ github.run_id }}
          path: ${{ runner.temp }}/b03_fx_proofs/
          retention-days: 30
          if-no-files-found: warn
