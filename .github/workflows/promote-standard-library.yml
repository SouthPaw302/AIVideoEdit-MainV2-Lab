name: Promote Neutral Standard Capability Library

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification runtime
        run: python -m pip install --upgrade pip numpy opencv-python-headless
      - name: Generate neutral effect/workflow registries and proof records
        run: python general/reusable/tools/promote_standard_library.py
      - name: Verify every standardized effect
        run: python general/reusable/fx_v2/verify_standard_effects.py
      - name: Verify workflow registry and selection scenarios
        run: python general/reusable/tools/workflow_resolver.py --verify --json
      - name: Compile generated Python
        run: python -m compileall -q bootstrap.py general/reusable
      - name: Preserve generated registry proof for review
        uses: actions/upload-artifact@v4
        with:
          name: neutral-standard-library-proof-${{ github.run_id }}
          path: |
            general/reusable/CANONICAL_EFFECT_REGISTRY.json
            general/reusable/STANDARD_WORKFLOW_REGISTRY.json
            general/reusable/fx_v2/proofs/*.json
          retention-days: 30
          if-no-files-found: error
