name: El Camión — FX artifact assembly and camera review

on:
  push:
    branches: [song/el-camion-y-la-carretera]
    paths:
      - "projects/el-camion-y-la-carretera/FX_ARTIFACT_INVENTORY.json"
      - "projects/el-camion-y-la-carretera/RENDER_JOB.json"
      - ".github/workflows/camion-fx-assembly.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: camion-fx-assembly
  cancel-in-progress: false

jobs:
  assemble-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OUT: ${{ github.workspace }}/.camion-fx-assembly
    steps:
      - name: Checkout isolated song branch and production manifests
        uses: actions/checkout@v4
        with:
          ref: song/el-camion-y-la-carretera
          fetch-depth: 0

      - name: Install media tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Resolve newest successful production runs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          workflows={
              "BATCH01_RUN":"camion-fx-batch-01.yml",
              "BATCH02_RUN":"camion-fx-batch-02.yml",
              "BATCH03_RUN":"camion-fx-batch-03.yml",
              "REAL_RENDER_RUN":"song-real-render.yml",
          }
          values={}
          for key, workflow in workflows.items():
              raw=subprocess.check_output([
                  "gh","run","list","--repo",os.environ["REPO"],
                  "--workflow",workflow,
                  "--branch","song/el-camion-y-la-carretera",
                  "--status","success",
                  "--limit","20",
                  "--json","databaseId,createdAt",
              ], text=True)
              runs=sorted(json.loads(raw), key=lambda item:item["createdAt"], reverse=True)
              if not runs:
                  raise SystemExit(f"no successful run found for {workflow}")
              values[key]=str(runs[0]["databaseId"])
          with Path(os.environ["GITHUB_ENV"]).open("a",encoding="utf-8") as fd:
              for key,value in values.items():
                  fd.write(f"{key}={value}\n")
          print(json.dumps(values,indent=2))
          PY

      - name: Download newest successful FX and real-render artifacts
        run: |
          set -euo pipefail
          mkdir -p "$OUT/fx/batch01" "$OUT/fx/batch02" "$OUT/fx/batch03"
          gh run download "$BATCH01_RUN" --repo "$REPO" --name "camion-batch01-fx-$BATCH01_RUN" --dir "$OUT/fx/batch01"
          gh run download "$BATCH02_RUN" --repo "$REPO" --name "camion-batch02-fx-$BATCH02_RUN" --dir "$OUT/fx/batch02"
          gh run download "$BATCH03_RUN" --repo "$REPO" --name "camion-batch03-fx-$BATCH03_RUN" --dir "$OUT/fx/batch03"
          mkdir -p "$OUT/base-real"
          gh run download "$REAL_RENDER_RUN" --repo "$REPO" --name "el-camion-batch03-real-$REAL_RENDER_RUN" --dir "$OUT/base-real"
          test -s "$OUT/base-real/real_music_film.mp4"
          cp "$OUT/base-real/real_music_film.mp4" "$OUT/el_camion_batch03_real_render_latest.mp4"

      - name: Verify artifact inventory and preserve continuation boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          inv=json.loads(Path("projects/el-camion-y-la-carretera/FX_ARTIFACT_INVENTORY.json").read_text())
          assert inv["totals"] == {"source_stills":30,"loop_mp4":30,"gif":30,"derived_png":270}
          root=Path(os.environ["OUT"])/"fx"
          clips=sorted(root.rglob("*_FX_loop_24fps.mp4"))
          gifs=sorted(root.rglob("*_FX_loop.gif"))
          pngs=sorted(root.rglob("*.png"))
          assert len(clips)==30, len(clips)
          assert len(gifs)==30, len(gifs)
          assert len(pngs)==270, len(pngs)
          required={s for b in inv["batches"] for s in b["requires_true_continuation"]}
          assert required == {"EC-02","EC-03","EC-04","EC-07","EC-10","EC-14","EC-15","EC-17","EC-19","EC-22","EC-24","EC-25","EC-26","EC-28","EC-30"}
          print("CANONICAL FX ARTIFACT INVENTORY: PASS — 30 MP4, 30 GIF, 270 PNG")
          print("TRUE-CONTINUATION SHOTS REMAIN PROTECTED:", ",".join(sorted(required)))
          PY

      - name: Render an editorial camera pass for environment-safe shots
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          root=Path(os.environ["OUT"])/"fx"
          dest=Path(os.environ["OUT"])/"camera"
          dest.mkdir(parents=True, exist_ok=True)
          safe={"EC-01","EC-05","EC-06","EC-08","EC-09","EC-11","EC-12","EC-13","EC-16","EC-18","EC-20","EC-21","EC-23","EC-27","EC-29"}
          sources=sorted(root.rglob("*_FX_loop_24fps.mp4"))
          assert len(sources)==30, len(sources)
          for src in sources:
              shot=src.name.removesuffix("_FX_loop_24fps.mp4")
              dst=dest/src.name
              if shot in safe:
                  subprocess.run([
                      "ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(src),
                      "-vf","scale=720:405:flags=lanczos,crop=640:360:x='40+40*sin(PI*t/2)':y='22+10*cos(PI*t/2)'",
                      "-t","1","-an","-c:v","libx264","-crf","18","-preset","veryfast",
                      "-pix_fmt","yuv420p",str(dst)
                  ],check=True)
              else:
                  subprocess.run([
                      "ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(src),
                      "-t","1","-an","-c:v","libx264","-crf","18","-preset","veryfast",
                      "-pix_fmt","yuv420p",str(dst)
                  ],check=True)
          clips=sorted(dest.glob("*.mp4"))
          assert len(clips)==30, len(clips)
          (Path(os.environ["OUT"])/"camera_clip_list.txt").write_text(
              "\n".join(str(p.resolve()) for p in clips)+"\n"
          )
          print("EDITORIAL CAMERA PASS: 15 environment-safe shots; 15 protected continuation shots")
          PY

      - name: Assemble 30-second all-batch FX and camera review with verified audio
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -i "$OUT/base-real/real_music_film.mp4" \
            -vn -c:a pcm_s16le "$OUT/original_audio.wav"
          python - <<'PY'
          import os
          from pathlib import Path
          clips=Path(os.environ["OUT"])/"camera_clip_list.txt"
          concat=Path(os.environ["OUT"])/"concat.txt"
          lines=[]
          for p in clips.read_text().splitlines():
              lines.append("file '" + str(Path(p).resolve()).replace("'","'\\''") + "'")
          concat.write_text("\n".join(lines)+"\n")
          PY
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i "$OUT/concat.txt" -i "$OUT/original_audio.wav" \
            -t 30 -map 0:v:0 -map 1:a:0 -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart "$OUT/el_camion_fx_camera_review_30s.mp4"

      - name: Technical QC and write a truthful review receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out=Path(os.environ["OUT"])
          mp4=out/"el_camion_fx_camera_review_30s.mp4"
          probe=json.loads(subprocess.check_output([
              "ffprobe","-v","error","-show_streams","-show_format","-of","json",str(mp4)
          ]))
          vs=[s for s in probe["streams"] if s["codec_type"]=="video"]
          aus=[s for s in probe["streams"] if s["codec_type"]=="audio"]
          assert vs and aus
          duration=float(probe["format"]["duration"])
          assert 29.5 <= duration <= 30.5, duration
          assert vs[0]["width"]==640 and vs[0]["height"]==360
          assert vs[0]["codec_name"]=="h264"
          assert aus[0]["codec_name"]=="aac"
          receipt={
            "schema":"aivideoedit.camera-assembly-review.v1",
            "project":"el-camion-y-la-carretera",
            "branch":"song/el-camion-y-la-carretera",
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "canonical_fx_runs":[int(os.environ["BATCH01_RUN"]),int(os.environ["BATCH02_RUN"]),int(os.environ["BATCH03_RUN"])],
            "real_render_run_id":int(os.environ["REAL_RENDER_RUN"]),
            "source_artifacts":{
              "batch01_run":int(os.environ["BATCH01_RUN"]),
              "batch02_run":int(os.environ["BATCH02_RUN"]),
              "batch03_run":int(os.environ["BATCH03_RUN"]),
              "real_render_run":int(os.environ["REAL_RENDER_RUN"])
            },
            "duration_seconds":duration,
            "video":{"width":640,"height":360,"codec":"h264"},
            "audio":{"codec":"aac","source":f"exact audio track extracted from newest successful real render run {os.environ['REAL_RENDER_RUN']}","audio_sha256":hashlib.sha256((out/"original_audio.wav").read_bytes()).hexdigest()},
            "editorial_camera_pass_shots":["EC-01","EC-05","EC-06","EC-08","EC-09","EC-11","EC-12","EC-13","EC-16","EC-18","EC-20","EC-21","EC-23","EC-27","EC-29"],
            "protected_true_continuation_shots":["EC-02","EC-03","EC-04","EC-07","EC-10","EC-14","EC-15","EC-17","EC-19","EC-22","EC-24","EC-25","EC-26","EC-28","EC-30"],
            "technical_qc":"PASS",
            "human_visual_approval":False,
            "production_complete":False,
            "note":"Editorial crop drift is a review treatment, not a claim of true articulated motion or camera capture."
          }
          receipt["video_sha256"]=hashlib.sha256(mp4.read_bytes()).hexdigest()
          (out/"CAMERA_ASSEMBLY_REVIEW_RECEIPT.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("CAMERA ASSEMBLY TECHNICAL QC: PASS")
          PY

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camion-fx-camera-review-${{ github.run_id }}
          path: ${{ github.workspace }}/.camion-fx-assembly/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish review-only prerelease
        if: success()
        run: |
          set -euo pipefail
          gh release create "lab-camera-review-${GITHUB_RUN_ID}" \
            "$OUT/el_camion_fx_camera_review_30s.mp4" \
            "$OUT/el_camion_batch03_real_render_latest.mp4" \
            "$OUT/CAMERA_ASSEMBLY_REVIEW_RECEIPT.json" \
            --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
            --title "El Camión — FX and camera review assembly" \
            --notes "30-second all-batch technical review assembled from the newest successful Batch 01/02/03 FX artifacts. The newest effect-bearing real-render MP4 is included as a separate review asset. Editorial camera drift is limited to environment-safe shots. True-continuation shots remain protected. Human visual approval required; not final release."
