name: AIVideoEdit — Human-gated final production release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Locked song/<slug> or project/<slug> production branch (never main)"
        type: string
        required: true
      manifest:
        description: "Production-branch relative path to exact full-song render manifest"
        type: string
        required: true
      review:
        description: "Production-branch relative path to human review JSON"
        type: string
        required: true
      proof_tag:
        description: "Existing real-film Lab prerelease with full proof assets"
        type: string
        required: true

permissions:
  contents: write
  issues: read

concurrency:
  group: aivideoedit-final-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  gate-and-release:
    name: Complete song and independently approved release ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production-release
    steps:
      - name: Check out immutable production engine from lab main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: engine
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the requested production source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Deny main, untrusted tags or missing locked production authority
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          PROOF_TAG: ${{ inputs.proof_tag }}
          MANIFEST: ${{ inputs.manifest }}
          REVIEW: ${{ inputs.review }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SouthPaw302/AIVideoEdit-MainV2-Lab"
          [[ "$SOURCE_REF" == song/* || "$SOURCE_REF" == project/* ]]
          [[ "$PROOF_TAG" =~ ^lab-real-film-[0-9]+$ ]]
          test -f "source/$MANIFEST"
          test -f "source/$REVIEW"
          python engine/scripts/validate_contract.py
          echo "Release accepts an existing prerelease proof; no render fallback."

      - name: Install independent decoded media inspector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffprobe -version
          ffmpeg -version

      - name: Download actual candidate and its execution evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_TAG: ${{ inputs.proof_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          gh release view "$PROOF_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease \
            --jq '.isPrerelease' | grep -x true
          gh release download "$PROOF_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/candidate" --pattern real_music_film.mp4 \
            --pattern render_receipt.json --pattern FX_LOCK.json \
            --pattern PRODUCTION_EXECUTION_LEDGER.json --pattern contact_sheet.jpg
          gh release download "$PROOF_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/candidate" --pattern RUN_LINEAGE.json || true
          for f in real_music_film.mp4 render_receipt.json FX_LOCK.json PRODUCTION_EXECUTION_LEDGER.json contact_sheet.jpg; do
            test -s "$RUNNER_TEMP/candidate/$f"
          done

      - name: Resolve exact immutable source commit that created the prerelease proof
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          source_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_commit_sha"])' "$RUNNER_TEMP/candidate/render_receipt.json")"
          engine_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["engine_commit_sha"])' "$RUNNER_TEMP/candidate/render_receipt.json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$engine_sha" =~ ^[0-9a-f]{40}$ ]]
          git -C source cat-file -e "$source_sha^{commit}"
          git -C source merge-base --is-ancestor "$source_sha" HEAD
          git -C engine cat-file -e "$engine_sha^{commit}"
          git -C engine merge-base --is-ancestor "$engine_sha" HEAD
          git -C source worktree add --detach "$GITHUB_WORKSPACE/source_proof" "$source_sha"
          cmp "source/$MANIFEST" "source_proof/$MANIFEST"
          echo "SOURCE_PROOF_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "ENGINE_PROOF_SHA=$engine_sha" >> "$GITHUB_ENV"

      - name: Enforce canonical source, narrative, recut and workflow production guards
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          export AIVIDEOEDIT_REPO_ROOT="$GITHUB_WORKSPACE/source_proof"
          export AIVIDEOEDIT_OS_ROOT="$GITHUB_WORKSPACE/engine"
          python engine/general/reusable/tools/production_guard.py --bootstrap-phase --branch "$SOURCE_REF"
          python engine/general/reusable/tools/narrative_guard.py --branch "$SOURCE_REF"
          python engine/general/reusable/tools/recut_guard.py --branch "$SOURCE_REF"
          python engine/general/reusable/tools/workflow_guard.py --branch "$SOURCE_REF"

      - name: Prove full-song source, current engine, FX, full export and human visual approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          MANIFEST: ${{ inputs.manifest }}
          REVIEW: ${{ inputs.review }}
        working-directory: engine
        run: |
          set -euo pipefail
          engine_sha="$ENGINE_PROOF_SHA"
          source_sha="$SOURCE_PROOF_SHA"
          lineage_args=()
          if [ -f "$RUNNER_TEMP/candidate/RUN_LINEAGE.json" ]; then
            lineage_args+=(--lineage "$RUNNER_TEMP/candidate/RUN_LINEAGE.json")
          fi
          PYTHONPATH="$PWD" python scripts/release_gate.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-branch "$SOURCE_REF" \
            --source-sha "$source_sha" --engine-sha "$engine_sha" \
            --source-root ../source_proof \
            --manifest "../source_proof/$MANIFEST" --review "../source/$REVIEW" \
            --receipt "$RUNNER_TEMP/candidate/render_receipt.json" \
            --export "$RUNNER_TEMP/candidate/real_music_film.mp4" \
            --fx-lock "$RUNNER_TEMP/candidate/FX_LOCK.json" \
            --ledger "$RUNNER_TEMP/candidate/PRODUCTION_EXECUTION_LEDGER.json" \
            --contact-sheet "$RUNNER_TEMP/candidate/contact_sheet.jpg" \
            --output "$RUNNER_TEMP/candidate/RELEASE_GATE.json" "${lineage_args[@]}"
          test -s "$RUNNER_TEMP/candidate/RELEASE_GATE.json"

      - name: Publish exact approved bytes, never a substitute or fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          c="$RUNNER_TEMP/candidate"
          test -s "$c/RELEASE_GATE.json"
          id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["production_id"])' "$c/RELEASE_GATE.json")"
          [[ "$id" =~ ^[a-zA-Z0-9_-]+$ ]]
          tag="production-$id-$GITHUB_RUN_ID"
          assets=("$c/real_music_film.mp4" "$c/RELEASE_GATE.json" \
            "$c/render_receipt.json" "$c/FX_LOCK.json" \
            "$c/PRODUCTION_EXECUTION_LEDGER.json" "$c/contact_sheet.jpg")
          if [ -f "$c/RUN_LINEAGE.json" ]; then assets+=("$c/RUN_LINEAGE.json"); fi
          gh release create "$tag" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$ENGINE_PROOF_SHA" \
            --title "$id — complete verified and human-approved music film" \
            --notes "Full song, exact sources, full decoded export, current FX lineage and authenticated human approval. Audit RELEASE_GATE.json for acceptance evidence."
          echo "Final production release gate PASS: $tag" >> "$GITHUB_STEP_SUMMARY"
