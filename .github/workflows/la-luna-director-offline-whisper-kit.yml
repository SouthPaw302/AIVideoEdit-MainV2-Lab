name: La Luna — Offline Director ASR Model Kit (NO SONG MEDIA)

on:
  push:
    branches:
      - song/la-luna-de-florida
    paths:
      - ".github/workflows/la-luna-director-offline-whisper-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-offline-model-kit:
    if: github.repository == 'SouthPaw302/AIVideoEdit-MainV2-Lab' && github.ref == 'refs/heads/song/la-luna-de-florida'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: song/la-luna-de-florida
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Bootstrap exact current-main OS on authorized song branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python bootstrap.py boot --repo-root "$PWD" --branch song/la-luna-de-florida --offline
          python scripts/la_luna_fx_canon_guard.py
      - name: Download open ASR runtime wheels and model to isolated artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/la-luna-offline-kit"/{wheels,model}
          python -m pip download --dest "$RUNNER_TEMP/la-luna-offline-kit/wheels" 'faster-whisper==1.1.1' 'requests==2.34.2'
          python -m pip install --disable-pip-version-check 'huggingface-hub==2.2.0' 'faster-whisper==1.1.1' 'requests==2.34.2'
          MODEL_DIR="$RUNNER_TEMP/la-luna-offline-kit/model" python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          from huggingface_hub import snapshot_download
          from faster_whisper import WhisperModel
          dest=Path(os.environ["MODEL_DIR"])
          root=snapshot_download(repo_id="Systran/faster-whisper-base",local_dir=str(dest))
          model=WhisperModel(str(dest),device="cpu",compute_type="int8",cpu_threads=4)
          files=[]
          for p in sorted(dest.rglob("*")):
              if p.is_file() and ".cache" not in p.parts:
                  files.append({"path":p.relative_to(dest).as_posix(),"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"size":p.stat().st_size})
          if not any(x["path"]=="model.bin" for x in files):raise SystemExit("REFUSE: model.bin missing")
          (dest.parent/"MODEL_KIT_MANIFEST.json").write_text(json.dumps({"schema":"aivideoedit.la-luna-whisper-offline-kit.v1","model_repo":"Systran/faster-whisper-base","model_files":files,"original_wav_in_runner":False,"audio_or_lyrics_copied_into_kit":False},indent=2)+"\n")
          print("MODEL KIT SHA MANIFEST: PASS, files",len(files),"bytes",sum(x["size"] for x in files))
          PY
      - name: Archive offline ASR kit only; no original song or user media
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: la-luna-offline-whisper-model-kit-${{ github.run_id }}
          path: ${{ runner.temp }}/la-luna-offline-kit/
          retention-days: 2
          compression-level: 0
          if-no-files-found: warn
